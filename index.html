<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cross Section Viewer</title>
<style>
  :root {
    --tc-blue: #0063a3;
    --tc-blue-dark: #004b7c;
    --bg: #f5f6f7;
    --border: #d9dde1;
    --text: #22292f;
    --muted: #667079;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
  }
  #app { padding: 12px; }
  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 10px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .plane-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .plane-row:last-child { margin-bottom: 0; }
  .plane-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    width: 60px;
  }
  .axis-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block;
  }
  .axis-x { background: #e5484d; }
  .axis-y { background: #30a46c; }
  .axis-z { background: #0091ff; }
  .slider-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 10px;
  }
  input[type="range"] { flex: 1; accent-color: var(--tc-blue); }
  input[type="number"] {
    width: 68px;
    padding: 3px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
  }
  .toggle-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    width: 26px; height: 26px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: var(--muted);
  }
  .toggle-btn.active {
    background: var(--tc-blue);
    border-color: var(--tc-blue);
    color: #fff;
  }
  .row-controls {
    display: flex;
    gap: 4px;
  }
  .btn {
    background: var(--tc-blue);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--tc-blue-dark); }
  .btn.secondary {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.secondary:hover { background: #f0f1f2; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .field-row label { display: flex; align-items: center; gap: 6px; }
  .range-inputs {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .range-inputs input { width: 62px; }
  .manual-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    margin-top: 8px;
  }
  .manual-grid label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    gap: 6px;
  }
  .manual-grid input { flex: 1; min-width: 0; }
  #status {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    min-height: 14px;
  }
  #status.error { color: #cc1e2c; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div id="app">
  <h1>📐 Cross Section Viewer</h1>

  <div class="card">
    <div class="btn-row">
      <button class="btn" id="drawBtn">✏️ Draw section line</button>
      <button class="btn secondary" id="cancelDrawBtn" style="display:none;">Cancel</button>
    </div>
    <div class="hint" style="margin-top:8px;">Click "Draw section line", then click two points in the 3D view to define the cut line in plan (X/Y). Elevation is ignored — the cut is always a vertical plane through that line, so it shows everything crossing it at every height.</div>

    <div class="field-row" style="margin-top:12px;">
      <span style="font-weight:600; color:var(--text);">Manual entry (mm)</span>
    </div>
    <div class="manual-grid">
      <label>X1 <input type="number" id="x1" step="10" value="0" /></label>
      <label>Y1 <input type="number" id="y1" step="10" value="0" /></label>
      <label>X2 <input type="number" id="x2" step="10" value="1000" /></label>
      <label>Y2 <input type="number" id="y2" step="10" value="0" /></label>
    </div>
    <div class="btn-row">
      <button class="btn secondary" id="applyManualBtn">Create from coordinates</button>
    </div>
  </div>

  <div class="card">
    <div class="plane-row">
      <span class="plane-label">Section</span>
      <div class="row-controls" style="margin-left:auto;">
        <button class="toggle-btn" id="flipBtn" title="Flip cut side" disabled>⇄</button>
      </div>
    </div>
    <div class="field-row">
      <label><input type="checkbox" id="showHandles" checked /> Show plane handles</label>
    </div>
    <div class="btn-row">
      <button class="btn" id="clearBtn">Clear section</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script src="app.js"></script>
</body>
</html>
