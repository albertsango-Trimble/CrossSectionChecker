<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cross Section Viewer</title>
<style>
  :root {
    --tc-blue: #0063a3;
    --tc-blue-dark: #004b7c;
    --bg: #f5f6f7;
    --border: #d9dde1;
    --text: #22292f;
    --muted: #667079;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
  }
  #app { padding: 12px; }
  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 10px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .plane-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .plane-row:last-child { margin-bottom: 0; }
  .plane-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    width: 60px;
  }
  .axis-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block;
  }
  .axis-x { background: #e5484d; }
  .axis-y { background: #30a46c; }
  .axis-z { background: #0091ff; }
  .slider-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 10px;
  }
  input[type="range"] { flex: 1; accent-color: var(--tc-blue); }
  input[type="number"] {
    width: 68px;
    padding: 3px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
  }
  .toggle-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    width: 26px; height: 26px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: var(--muted);
  }
  .toggle-btn.active {
    background: var(--tc-blue);
    border-color: var(--tc-blue);
    color: #fff;
  }
  .row-controls {
    display: flex;
    gap: 4px;
  }
  .btn {
    background: var(--tc-blue);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--tc-blue-dark); }
  .btn.secondary {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.secondary:hover { background: #f0f1f2; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .field-row label { display: flex; align-items: center; gap: 6px; }
  .range-inputs {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .range-inputs input { width: 62px; }
  #status {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    min-height: 14px;
  }
  #status.error { color: #cc1e2c; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div id="app">
  <h1>📐 Cross Section Viewer</h1>

  <div class="card">
    <div class="plane-row" data-axis="X">
      <span class="plane-label"><span class="axis-dot axis-x"></span>X</span>
      <div class="slider-wrap">
        <input type="range" class="pos-slider" data-axis="X" min="-10000" max="10000" step="10" value="0" disabled />
        <input type="number" class="pos-number" data-axis="X" step="10" value="0" disabled />
      </div>
      <div class="row-controls">
        <button class="toggle-btn flip-btn" data-axis="X" title="Flip direction" disabled>⇄</button>
        <button class="toggle-btn enable-btn" data-axis="X" title="Enable X section">X</button>
      </div>
    </div>

    <div class="plane-row" data-axis="Y">
      <span class="plane-label"><span class="axis-dot axis-y"></span>Y</span>
      <div class="slider-wrap">
        <input type="range" class="pos-slider" data-axis="Y" min="-10000" max="10000" step="10" value="0" disabled />
        <input type="number" class="pos-number" data-axis="Y" step="10" value="0" disabled />
      </div>
      <div class="row-controls">
        <button class="toggle-btn flip-btn" data-axis="Y" title="Flip direction" disabled>⇄</button>
        <button class="toggle-btn enable-btn" data-axis="Y" title="Enable Y section">Y</button>
      </div>
    </div>

    <div class="plane-row" data-axis="Z">
      <span class="plane-label"><span class="axis-dot axis-z"></span>Z</span>
      <div class="slider-wrap">
        <input type="range" class="pos-slider" data-axis="Z" min="-10000" max="10000" step="10" value="0" disabled />
        <input type="number" class="pos-number" data-axis="Z" step="10" value="0" disabled />
      </div>
      <div class="row-controls">
        <button class="toggle-btn flip-btn" data-axis="Z" title="Flip direction" disabled>⇄</button>
        <button class="toggle-btn enable-btn" data-axis="Z" title="Enable Z section">Z</button>
      </div>
    </div>

    <div class="field-row">
      <label><input type="checkbox" id="showHandles" checked /> Show plane handles</label>
    </div>

    <div class="range-inputs">
      <span>Range (mm):</span>
      <input type="number" id="rangeMin" value="-10000" step="100" />
      <span>to</span>
      <input type="number" id="rangeMax" value="10000" step="100" />
      <button class="btn secondary" id="fitBtn" style="margin-left:auto; padding:4px 8px;">Fit to model</button>
    </div>

    <div class="btn-row">
      <button class="btn" id="clearBtn">Clear all sections</button>
    </div>

    <div id="status"></div>
  </div>

  <div class="hint">Toggle X / Y / Z to add an axis-aligned cutting plane. Drag the slider or type a value (millimeters from the model origin) to move it through the model. Use ⇄ to flip which side is cut away.</div>
</div>

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script src="app.js"></script>
</body>
</html>
